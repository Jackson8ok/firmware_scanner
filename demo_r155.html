<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R155 合规报告演示 - 固件漏洞扫描平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        header p {
            opacity: 0.9;
            font-size: 1.1em;
        }
        
        .demo-badge {
            display: inline-block;
            background: #f39c12;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            margin-top: 10px;
        }
        
        main {
            padding: 40px;
        }
        
        /* 统计卡片网格 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .stat-card h3 {
            font-size: 1em;
            color: #666;
            margin-bottom: 10px;
        }
        
        .stat-card .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #2c3e50;
        }
        
        .stat-card.critical {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }
        
        .stat-card.high {
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            color: white;
        }
        
        .stat-card.medium {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
        }
        
        .stat-card.low {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }
        
        .stat-card.compliance {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            grid-column: span 2;
        }
        
        .stat-card.compliance small {
            display: block;
            margin-top: 10px;
            font-size: 0.9em;
            opacity: 0.9;
        }
        
        /* 选项卡样式 */
        .tabs-section {
            margin-top: 40px;
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
        }
        
        .tab-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .tab-btn {
            padding: 12px 25px;
            border: none;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .tab-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        
        .tab-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .tab-pane {
            display: none;
            animation: fadeIn 0.3s;
        }
        
        .tab-pane.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* 表格样式 */
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        
        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 600;
        }
        
        tr:hover {
            background: #f8f9fa;
        }
        
        /* 饼图容器 */
        .chart-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            min-height: 400px;
        }
        
        /* 建议列表 */
        .recommendations-list {
            background: white;
            padding: 30px;
            border-radius: 15px;
        }
        
        .list-group-item {
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            border-left: 5px solid #667eea;
            background: #f8f9fa;
        }
        
        .list-group-item.info {
            border-left-color: #3b82f6;
        }
        
        .list-group-item.success {
            border-left-color: #10b981;
        }
        
        .list-item-header {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            background: #667eea;
            color: white;
            border-radius: 50%;
            font-weight: bold;
        }
        
        .rec-text {
            flex: 1;
            font-size: 1.1em;
            color: #333;
        }
        
        /* Chart.js Canvas */
        canvas {
            max-width: 100%;
            margin: 20px auto;
        }
        
        /* 响应式 */
        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .stat-card.compliance {
                grid-column: span 1;
            }
            
            main {
                padding: 20px;
            }
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
            color: #666;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🐢 R155 合规报告演示</h1>
            <p>固件漏洞扫描平台 - 欧盟 UNECE R155 法规合规检查</p>
            <span class="demo-badge">📦 MOCK 数据演示模式</span>
        </header>

        <main id="app">
            <!-- 统计数据 -->
            <section class="stats-grid" id="statsGrid">
                <div class="stat-card">
                    <h3>总 CVE 数</h3>
                    <p class="stat-value" id="totalCves">0</p>
                </div>
                <div class="stat-card critical">
                    <h3>严重</h3>
                    <p class="stat-value" id="criticalCount">0</p>
                </div>
                <div class="stat-card high">
                    <h3>高危</h3>
                    <p class="stat-value" id="highCount">0</p>
                </div>
                <div class="stat-card medium">
                    <h3>中危</h3>
                    <p class="stat-value" id="mediumCount">0</p>
                </div>
                <div class="stat-card low">
                    <h3>低危</h3>
                    <p class="stat-value" id="lowCount">0</p>
                </div>
                <div class="stat-card compliance" id="complianceCard">
                    <h3>🔒 R155 合规评分</h3>
                    <p class="stat-value" id="complianceScore">--</p>
                    <small id="complianceStatus"></small>
                </div>
            </section>

            <!-- R155 合规详情选项卡 -->
            <section class="tabs-section" id="r155TabsSection">
                <h2 style="margin-bottom: 20px;">🔍 R155 合规分析详情</h2>
                
                <div class="tab-nav">
                    <button class="tab-btn active" onclick="switchTab('compliance-details')">📋 违规详情</button>
                    <button class="tab-btn" onclick="switchTab('compliance-categories')">📊 类别得分</button>
                    <button class="tab-btn" onclick="switchTab('compliance-trend')">📈 趋势分析</button>
                    <button class="tab-btn" onclick="switchTab('compliance-heatmap')">🔥 热力图</button>
                    <button class="tab-btn" onclick="switchTab('compliance-sbom')">📦 SBOM 清单</button>
                    <button class="tab-btn" onclick="switchTab('compliance-recommendations')">💡 改进建议</button>
                    <button class="tab-btn" style="background: #10b981; color: white;" onclick="exportToPDF()">📄 导出 PDF</button>
                    <button class="tab-btn" style="background: #3b82f6; color: white;" onclick="exportToExcel()">📊 导出 Excel</button>
                </div>
                
                <!-- 高级过滤器（新增） -->
                <div style="background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px;">
                    <h4 style="margin-bottom: 15px;">🔍 高级过滤</h4>
                    <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                        <label>最小扣分:</label>
                        <select id="minPenaltyFilter" style="padding: 8px; border-radius: 5px; border: 1px solid #ddd;">
                            <option value="0">全部</option>
                            <option value="5">≥5 分</option>
                            <option value="7">≥7 分</option>
                            <option value="9">≥9 分</option>
                        </select>
                        
                        <label>规则 ID:</label>
                        <input type="text" id="ruleIdSearch" placeholder="例如：CM.01" 
                               style="padding: 8px; border-radius: 5px; border: 1px solid #ddd; width: 150px;">
                        
                        <label>CVE ID:</label>
                        <input type="text" id="cveIdSearch" placeholder="搜索 CVE..." 
                               style="padding: 8px; border-radius: 5px; border: 1px solid #ddd; width: 200px;">
                        
                        <button onclick="resetFilters()" style="padding: 8px 15px; background: #6b7280; color: white; border: none; border-radius: 5px; cursor: pointer;">重置筛选</button>
                    </div>
                </div>
                
                <div class="tab-content-wrapper">
                    <!-- 违规详情表格 -->
                    <div id="compliance-details" class="tab-pane active">
                        <table>
                            <thead>
                                <tr>
                                    <th>规则 ID</th>
                                    <th>CVE ID</th>
                                    <th>组件</th>
                                    <th>扣分</th>
                                    <th>修复建议</th>
                                </tr>
                            </thead>
                            <tbody id="violationsBody"></tbody>
                        </table>
                    </div>
                    
                    <!-- 类别得分图表 -->
                    <div id="compliance-categories" class="tab-pane">
                        <div class="chart-container">
                            <canvas id="categoryPieChart" width="600" height="400"></canvas>
                        </div>
                    </div>
                    
                    <!-- 🆕 趋势分析 -->
                    <div id="compliance-trend" class="tab-pane">
                        <div id="trendContent"></div>
                    </div>
                    
                    <!-- 🆕 热力图 -->
                    <div id="compliance-heatmap" class="tab-pane">
                        <div id="heatmapContent"></div>
                    </div>
                    
                    <!-- 🆕 SBOM 清单 -->
                    <div id="compliance-sbom" class="tab-pane">
                        <div id="sbomContent"></div>
                    </div>
            </section>
        </main>
    </div>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    
    <!-- R155 UI 增强版逻辑 -->
    <script src="/mnt/workspace/firmware_scanner/frontend/static/r155-ui-enhanced.js"></script>
    
    <!-- 演示数据与初始化 -->
    <script>

        // 重置过滤器
        function resetFilters() {
            document.getElementById('minPenaltyFilter').value = '0';
            document.getElementById('ruleIdSearch').value = '';
            document.getElementById('cveIdSearch').value = '';
            
            if (currentComplianceData && currentComplianceData.violations) {
                renderViolationsTable(currentComplianceData.violations);
            }
        }

        // 初始化页面
        document.addEventListener('DOMContentLoaded', () => {

            updateComplianceStats(mockComplianceData);
            
            // 保存数据供后续使用
            window.currentComplianceData = mockComplianceData;
            
            // 默认显示第一个选项卡的内容
            renderViolationsTable(mockComplianceData.violations);

            console.log('✅ 增强版演示数据加载完成！');

    </script>
</body>
</html>

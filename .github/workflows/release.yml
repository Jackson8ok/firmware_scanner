# Automated Release Workflow
name: Release Workflow

on:
  release:
    types: [published]

jobs:
  # ============================================================
  # Build Docker Image and Push to Registry
  # ============================================================
  build-docker:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker summary
        run: |
          echo "📦 Docker image published:"
          echo "   Tags: ${{ steps.meta.outputs.tags }}"

  # ============================================================
  # Generate Changelog
  # ============================================================
  changelog:
    name: 📝 Generate Changelog
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        run: |
          TAG_NAME=${{ github.event.release.tag_name }}
          echo "📝 Generating changelog for $TAG_NAME"
          
          # Extract commits since last tag
          git log --pretty=format:"%s" "${{ github.event.release.target_commitish }}~1..${{ github.event.release.target_commitish }}" > CHANGELOG.tmp
          
          echo "# Changelog for $TAG_NAME" > CHANGELOG_$TAG_NAME.md
          echo "" >> CHANGELOG_$TAG_NAME.md
          echo "Generated on: $(date)" >> CHANGELOG_$TAG_NAME.md
          echo "" >> CHANGELOG_$TAG_NAME.md
          cat CHANGELOG.tmp >> CHANGELOG_$TAG_NAME.md

      - name: Upload changelog
        uses: actions/upload-artifact@v3
        with:
          name: changelog
          path: CHANGELOG_*.md

  # ============================================================
  # Notification (Slack/Discord)
  # ============================================================
  notify:
    name: 📢 Send Notifications
    runs-on: ubuntu-latest
    needs: [build-docker]
    
    steps:
      - name: Discord notification
        uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          title: "🎉 New Release: ${{ github.event.release.tag_name }}"
          description: |
            **Version**: ${{ github.event.release.tag_name }}
            **Author**: ${{ github.event.release.author.login }}
            **URL**: ${{ github.event.release.html_url }}
          color: 3066993

      - name: Slack notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_TITLE: "🚀 Firmware Scanner Released"
          SLACK_MESSAGE: "Version ${{ github.event.release.tag_name }} is now available!"
          SLACK_COLOR: good
